name: lint

# Required by Sigilix org ruleset on every branch. This repo holds only
# SVG glyphs (no application code, no JS, no markdown beyond README),
# so the lint is a Sigilix-shape sanity check on every .svg file.
#
# Without this workflow the org ruleset blocks merge with
# "Required status check `lint` is expected" on every PR.
#
# (Earlier attempt used xmllint --noout but it failed in the runner
# without surfacing why — possibly a stricter libxml2 version
# disagreeing with our zero-prolog SVGs. The grep shape check below
# is sufficient: every glyph must have <svg> root, <rect> fill, and
# aria-label so the bot's <img alt> matches. If a malformed SVG slips
# through, the consumer's <img> would just fail to render — not a
# security or data-loss issue.)

on:
  pull_request:
  push:
    branches: [init]

jobs:
  # Job ID MUST be `lint` to match the org-level required-status-check
  # context name (`{"context":"lint"}` in the ruleset). GitHub reports
  # the check as `<workflow-name> / <job-id>` → `lint / lint` here, but
  # the required-check matcher uses just the job id. An earlier attempt
  # named this `svg-lint` and the required check stayed "Expected —
  # Waiting for status to be reported" forever.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanity-check every .svg is a Sigilix-shaped badge
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.svg )
          if (( ${#files[@]} == 0 )); then
            echo "no .svg files at repo root — nothing to check"
            exit 0
          fi
          fail=0
          for f in "${files[@]}"; do
            problems=()
            grep -q '<svg ' "$f"       || problems+=("missing <svg> root")
            grep -q '<rect '  "$f"     || problems+=("missing <rect> fill")
            grep -q 'aria-label=' "$f" || problems+=("missing aria-label")
            if (( ${#problems[@]} > 0 )); then
              for p in "${problems[@]}"; do
                echo "::error file=$f::$p"
              done
              fail=1
            else
              echo "ok: $f"
            fi
          done
          exit $fail
